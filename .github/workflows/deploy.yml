name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - Gallery

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages  # mandatory for Pages deployment

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configure Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # 3️⃣ Build project (optional, uncomment if needed)
      # - name: Build project
      #   run: |
      #     npm install
      #     npm run build

      # 4️⃣ Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # 5️⃣ Output the URL of the deployed site
      - name: Show GitHub Pages URL
        run: echo "✅ Deployed site URL: ${{ steps.pages.outputs.page_url }}"
